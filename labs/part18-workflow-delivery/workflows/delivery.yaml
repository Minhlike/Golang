# ==============================================================================
# WORKFLOW SPECIMEN (MẪU NGHIÊN CỨU & KIỂM TRA REVIEWABLE)
# Vị trí: labs/part18-workflow-delivery/workflows/delivery.yaml
# Trạng thái: Đây là tài liệu mẫu trong lab học tập, KHÔNG PHẢI workflow active
# trong thư mục .github/workflows của repository. Không tuyên bố là đã chạy
# trên hạ tầng cloud thật.
# ==============================================================================

name: Delivery Pipeline Specimen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Tối thiểu quyền ở cấp độ toàn workflow: mặc định chỉ đọc contents
permissions:
  contents: read

jobs:
  verify:
    name: Verify Source & Tests
    runs-on: ubuntu-latest
    steps:
      # Pinned bằng immutable commit SHA thay vì mutable tag
      - name: Checkout Source Revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041d5d36e89ee602123d24268e0ec2d978a6375 # v5.3.0
        with:
          go-version: '1.27.1'
          check-latest: false

      # Kiểm tra đúng các module thuộc delivery path thay vì chạy ở repository root
      - name: Verify Service Module (part16-real-signals)
        working-directory: labs/part16-real-signals
        run: |
          go test -v ./...
          go vet ./...
          go test -race ./...

      - name: Verify Gate Module (part18-workflow-delivery)
        working-directory: labs/part18-workflow-delivery
        run: |
          go test -v ./...
          go vet ./...
          go test -race ./...

  build-artifact:
    name: Build Immutable Artifact
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      source_revision: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Checkout Source Revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record Source Revision
        id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Image and Capture OCI Manifest Metadata
        id: build
        run: |
          # Buildx với --metadata-file ghi lại metadata OCI chính thức.
          # Phân biệt ranh giới kỹ thuật:
          # - Local Image ID (.Id): mã băm config JSON của Docker daemon cục bộ.
          # - OCI Manifest Digest: mã băm nội dung của OCI manifest (bao gồm layer descriptors),
          #   được registry và Kubernetes dùng để kéo ảnh chính xác theo digest.
          # Tuyệt đối không đánh đồng Local Image ID với Manifest Digest.
          docker buildx build \
            --file labs/part17-container-kubernetes/Dockerfile \
            --tag probe-api:build-${{ steps.vars.outputs.sha }} \
            --metadata-file build-metadata.json \
            --load \
            labs/part16-real-signals

          # Khi push registry thật hoặc export OCI layout, Buildx ghi nhận OCI manifest digest trong containerimage.digest
          MANIFEST_DIGEST=$(jq -r '."containerimage.digest" // empty' build-metadata.json 2>/dev/null || true)

          # Phân biệt ranh giới kỹ thuật:
          # - Local Image ID (.Id từ docker inspect): mã băm config JSON của daemon cục bộ.
          # - OCI Manifest Digest: mã băm nội dung của OCI manifest (bao gồm layer descriptors).
          # Nếu không push lên OCI registry (hoặc export OCI archive), daemon local KHÔNG CÓ
          # manifest digest thật. Tuyệt đối không fallback vào chuỗi bịa đặt hay config ID.
          if [ -z "$MANIFEST_DIGEST" ]; then
            echo "::error::Khong tim thay OCI manifest digest hop le tu build metadata." >&2
            echo "Luu y: Image ID tu daemon cuc bo khong phai OCI manifest digest." >&2
            echo "Can push len OCI registry de co manifest digest dung chuan truoc khi gate/deploy." >&2
            exit 1
          fi

          # Kiem tra dinh dang sha256:64hex hop le
          if ! echo "$MANIFEST_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Manifest digest khong dung dinh dang sha256 (64 hex): $MANIFEST_DIGEST" >&2
            exit 1
          fi

          echo "digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Artifact Manifest Digest: $MANIFEST_DIGEST for revision ${{ steps.vars.outputs.sha }}"

  promote-production:
    name: Promote to Production
    needs: build-artifact
    runs-on: ubuntu-latest
    environment: production
    # Chỉ job deploy mới được cấp quyền id-token: write để xác thực OIDC
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Source Revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041d5d36e89ee602123d24268e0ec2d978a6375 # v5.3.0
        with:
          go-version: '1.27.1'
          check-latest: false

      - name: Evaluate Promotion Gate (Fail-Closed on Missing Provenance)
        run: |
          # tests-passed=true được suy ra hợp lệ từ dependency graph (job verify đã pass).
          # provenance-verified=false vì chưa có bước ký số / xác thực attestation chuyên trách.
          # Tuyệt đối không hard-code "true" (chống evidence theater).
          # Gate sẽ từ chối candidate theo đúng nguyên tắc fail-closed và exit 1.
          # Bỏ hoàn toàn || echo hay swallow error: job PHẢI DỪNG NGAY VỚI EXIT CODE KHÁC 0.
          go run ./labs/part18-workflow-delivery/cmd/promote-gate \
            --digest "${{ needs.build-artifact.outputs.image_digest }}" \
            --revision "${{ needs.build-artifact.outputs.source_revision }}" \
            --tests-passed=true \
            --provenance-verified=false

      # Minh họa bước đổi OIDC token lấy quyền IAM tạm thời (không dùng long-lived secret)
      # - name: Assume AWS Role via OIDC
      #   uses: aws-actions/configure-aws-credentials@e3ddf130cb0ab0da777f2e0085023d066bb25ce1 # v4.0.2
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy-production
      #     aws-region: ap-southeast-1

      # Bước deploy chỉ tồn tại dưới dạng tài liệu mô tả (documented / commented).
      # Khi gate từ chối (exit code 1 ở trên), GitHub Actions dừng ngay lập tức và
      # tuyệt đối KHÔNG CÓ BẤT KỲ LỆNH DEPLOY NÀO ĐƯỢC THỰC THI.
      # - name: Deploy Desired State by Digest
      #   run: |
      #     echo "Promoting immutable artifact to production:"
      #     echo "Image Digest: ${{ needs.build-artifact.outputs.image_digest }}"
      #     echo "Revision: ${{ needs.build-artifact.outputs.source_revision }}"
      #     # Tuyệt đối không dùng :latest hoặc branch tag để deploy production
