apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appservices.apps.example.com
spec:
  group: apps.example.com
  names:
    plural: appservices
    singular: appservice
    kind: AppService
    listKind: AppServiceList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, replicas, port]
              properties:
                image:
                  type: string
                  minLength: 1
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                  format: int32
                phase:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
