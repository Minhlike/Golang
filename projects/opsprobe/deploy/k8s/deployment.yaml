apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsprobe
  namespace: default
  labels:
    app.kubernetes.io/name: opsprobe
    app.kubernetes.io/component: observer
spec:
  # SQLite la embedded file-based database, khong ho tro multi-writer concurrent tu nhieu pod doc lap.
  # Vi vay, deployment su dung replicas: 1 ket hop PersistentVolumeClaim (ReadWriteOnce).
  # Neu can scale ngang (replicas > 1), can refactor store layer sang he quan tri C/S nhu PostgreSQL.
  replicas: 1
  strategy:
    type: Recreate # Recreate bao dam pod cu giai phong lock tren PVC truoc khi pod moi duoc mount
  selector:
    matchLabels:
      app.kubernetes.io/name: opsprobe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsprobe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opsprobe
          # Luu y: Day la manifest mau san xuat, da validate cu phap/schema; trien khai live yeu cau cluster k8s that.
          # Image duoi day la placeholder; CI/CD pipeline phai build va pin digest da verify truoc khi apply:
          # vi du: ghcr.io/minhlike/opsprobe@sha256:REPLACE_WITH_VERIFIED_MANIFEST_DIGEST
          image: ghcr.io/minhlike/opsprobe:v1.0.0 # REPLACE_WITH_VERIFIED_MANIFEST_DIGEST_BEFORE_APPLY
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - "--addr=:8080"
            - "--db=/data/opsprobe.db"
          env:
            - name: OPSPROBE_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: opsprobe-config
                  key: default_concurrency
            - name: OPSPROBE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: opsprobe-config
                  key: default_timeout
            - name: OPSPROBE_MAX_ACTIVE_RUNS
              valueFrom:
                configMapKeyRef:
                  name: opsprobe-config
                  key: max_active_runs
            - name: OPSPROBE_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: opsprobe-config
                  key: log_level
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: opsprobe-data-pvc
